<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Псевдо-чат | ПР09</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
            color: #333;
            line-height: 1.6;
            padding: 20px;
            max-width: 1200px;
            margin: 0 auto;
        }
        
        h1 {
            text-align: center;
            margin-bottom: 30px;
            color: #2c3e50;
            padding-bottom: 10px;
            border-bottom: 2px solid #3498db;
        }
        
        .container {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }
        
        .chat-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100%;
        }
        
        .chat-box {
            width: 100%;
            max-width: 800px;
            height: 500px;
            background-color: white;
            border-radius: 10px;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
            padding: 20px;
            overflow-y: auto;
            margin-bottom: 20px;
            border: 1px solid #ddd;
        }
        
        .message {
            margin-bottom: 15px;
            padding: 12px 15px;
            border-radius: 10px;
            position: relative;
            animation: fadeIn 0.3s ease;
        }
        
        .user1 {
            background-color: #e3f2fd;
            border-left: 5px solid #2196f3;
        }
        
        .user2 {
            background-color: #f1f8e9;
            border-left: 5px solid #8bc34a;
        }
        
        .message-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 8px;
            font-size: 0.9em;
        }
        
        .user-name {
            font-weight: bold;
        }
        
        .user1 .user-name {
            color: #1976d2;
        }
        
        .user2 .user-name {
            color: #689f38;
        }
        
        .message-time {
            color: #777;
            font-size: 0.85em;
        }
        
        .message-content {
            word-wrap: break-word;
            line-height: 1.5;
        }
        
        .input-section {
            display: flex;
            justify-content: space-between;
            width: 100%;
            max-width: 800px;
            gap: 20px;
        }
        
        .user-input {
            flex: 1;
            background-color: white;
            border-radius: 10px;
            padding: 20px;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
        }
        
        .user-input h3 {
            margin-bottom: 15px;
            color: #2c3e50;
            text-align: center;
        }
        
        .user-input textarea {
            width: 100%;
            height: 100px;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 16px;
            resize: none;
            margin-bottom: 15px;
        }
        
        .send-button {
            width: 100%;
            padding: 12px;
            background-color: #3498db;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .send-button:hover {
            background-color: #2980b9;
        }
        
        .user2 .send-button {
            background-color: #2ecc71;
        }
        
        .user2 .send-button:hover {
            background-color: #27ae60;
        }
        
        .controls {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 10px;
            width: 100%;
            max-width: 800px;
        }
        
        .control-button {
            padding: 12px 20px;
            background-color: #34495e;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 16px;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        
        .control-button:hover {
            background-color: #2c3e50;
        }
        
        #clearAll {
            background-color: #e74c3c;
        }
        
        #clearAll:hover {
            background-color: #c0392b;
        }
        
        #removeFirst {
            background-color: #f39c12;
        }
        
        #removeFirst:hover {
            background-color: #d68910;
        }
        
        #removeLast {
            background-color: #9b59b6;
        }
        
        #removeLast:hover {
            background-color: #8e44ad;
        }
        
        .empty-message {
            color: #999;
            font-style: italic;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .info {
            text-align: center;
            color: #7f8c8d;
            margin-top: 10px;
            font-size: 0.9em;
        }
        
        @media (max-width: 768px) {
            .input-section {
                flex-direction: column;
            }
            
            .controls {
                flex-wrap: wrap;
            }
            
            .chat-box {
                height: 400px;
            }
        }
    </style>
</head>
<body>
    <h1>Псевдо-чат для двух пользователей</h1>
    
    <div class="container">
        <div class="chat-container">
            <div class="chat-box" id="chatBox">
                <div class="message empty-message" id="emptyMessage">
                    Чат пуст. Отправьте первое сообщение!
                </div>
            </div>
            
            <div class="input-section">
                <div class="user-input">
                    <h3>Пользователь 1</h3>
                    <textarea id="user1Input" placeholder="Введите сообщение..."></textarea>
                    <button class="send-button" id="sendUser1">Отправить</button>
                </div>
                
                <div class="user-input">
                    <h3>Пользователь 2</h3>
                    <textarea id="user2Input" placeholder="Введите сообщение..."></textarea>
                    <button class="send-button" id="sendUser2">Отправить</button>
                </div>
            </div>
            
            <div class="controls">
                <button class="control-button" id="clearAll">Очистить чат</button>
                <button class="control-button" id="removeFirst">Удалить первое сообщение</button>
                <button class="control-button" id="removeLast">Удалить последнее сообщение</button>
            </div>
        </div>
    </div>

    <script>
        // Основные переменные
        const chatBox = document.getElementById('chatBox');
        const emptyMessage = document.getElementById('emptyMessage');
        const user1Input = document.getElementById('user1Input');
        const user2Input = document.getElementById('user2Input');
        const sendUser1Btn = document.getElementById('sendUser1');
        const sendUser2Btn = document.getElementById('sendUser2');
        const clearAllBtn = document.getElementById('clearAll');
        const removeFirstBtn = document.getElementById('removeFirst');
        const removeLastBtn = document.getElementById('removeLast');
        
        // Функция для добавления сообщения в чат
        function addMessage(user, text) {
            // Скрываем сообщение о пустом чате
            if (emptyMessage.style.display !== 'none') {
                emptyMessage.style.display = 'none';
            }
            
            // Создаем элемент сообщения
            const messageElement = document.createElement('div');
            messageElement.className = `message user${user}`;
            
            // Определяем имя пользователя
            const userName = user === 1 ? 'Пользователь 1' : 'Пользователь 2';
            
            // Создаем содержимое сообщения
            messageElement.innerHTML = `
                <div class="message-header">
                    <div class="user-name">${userName}</div>
                    <div class="message-time"></div>
                </div>
                <div class="message-content">${text || '<span class="empty-message">(пустое сообщение)</span>'}</div>
            `;
            
            // Добавляем сообщение в начало чата
            chatBox.insertBefore(messageElement, chatBox.firstChild);
            
            // Прокручиваем чат вверх, чтобы показать новое сообщение
            chatBox.scrollTop = 0;
        }
        
        // Функция для отправки сообщения от пользователя 1
        function sendUser1Message() {
            const text = user1Input.value.trim();
            addMessage(1, text);
            
            // Очищаем поле ввода
            user1Input.value = '';
            
            // Возвращаем фокус на поле ввода
            user1Input.focus();
        }
        
        // Функция для отправки сообщения от пользователя 2
        function sendUser2Message() {
            const text = user2Input.value.trim();
            addMessage(2, text);
            
            // Очищаем поле ввода
            user2Input.value = '';
            
            // Возвращаем фокус на поле ввода
            user2Input.focus();
        }
        
        // Функция для очистки всего чата
        function clearAllMessages() {
            // Удаляем все сообщения
            const messages = document.querySelectorAll('.message');
            messages.forEach(message => message.remove());
            
            // Показываем сообщение о пустом чате
            emptyMessage.style.display = 'block';
        }
        
        // Функция для удаления первого сообщения
        function removeFirstMessage() {
            const firstMessage = chatBox.querySelector('.message');
            
            if (firstMessage) {
                firstMessage.remove();
            }
            
            // Если сообщений не осталось, показываем сообщение о пустом чате
            if (!chatBox.querySelector('.message')) {
                emptyMessage.style.display = 'block';
            }
        }
        
        // Функция для удаления последнего сообщения
        function removeLastMessage() {
            const messages = chatBox.querySelectorAll('.message');
            
            if (messages.length > 0) {
                messages[messages.length - 1].remove();
            }
            
            // Если сообщений не осталось, показываем сообщение о пустом чате
            if (!chatBox.querySelector('.message')) {
                emptyMessage.style.display = 'block';
            }
        }
        
        // Добавляем обработчики событий для кнопок отправки
        sendUser1Btn.addEventListener('click', sendUser1Message);
        sendUser2Btn.addEventListener('click', sendUser2Message);
        
        // Добавляем обработчики событий для кнопок управления
        clearAllBtn.addEventListener('click', clearAllMessages);
        removeFirstBtn.addEventListener('click', removeFirstMessage);
        removeLastBtn.addEventListener('click', removeLastMessage);
        
        // Добавляем возможность отправки сообщения по нажатию Enter
        user1Input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendUser1Message();
            }
        });
        
        user2Input.addEventListener('keydown', function(event) {
            if (event.key === 'Enter' && !event.shiftKey) {
                event.preventDefault();
                sendUser2Message();
            }
        });
    </script>
</body>
</html>
