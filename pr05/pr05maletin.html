
<!DOCTYPE html>
<html lang="ru">
<head>
	<meta charset="utf-8">
	<title>Анимация объекта с использованием CSS3</title>
	<link rel="stylesheet" href="maletinpr05.css">
	
</head>

<body>
	<main>
		<h1>ПР02. Анимация объекта с использованием CSS3 Выполнил Малетин Алексей</h1>
        <div id="moveDiv"></div>

		<article class="wrapSlider">
			
			<input type="radio" name="Pointers" id="pnt1" checked>
			<input type="radio" name="Pointers" id="pnt2">
			<input type="radio" name="Pointers" id="pnt3">
            <input type="radio" name="Pointers" id="pnt4">
            <input type="radio" name="Pointers" id="pnt5">
			
			
			<div class="listSlides">	
				<div class="slides img1"><img src="p5.jpg"></div>
				<div class="slides img2"><img src="p1.png"></div>
				<div class="slides img3"><img src="p2.png"></div>
                <div class="slides img4"><img src="p3.png"></div>
                <div class="slides img5"><img src="p4.png"></div>
			</div>
			
			
			<div class="ctrlPanel">
				<label for="pnt1"></label>
				<label for="pnt2"></label>
				<label for="pnt3"></label>
                <label for="pnt4"></label>
                <label for="pnt5"></label>
			</div>
		</article>
		
        <div class="bottom-image">
            <img src ="p6.jpg" alt="Progrmming language">
        </div>
	</main>
	
</body>

</html>
